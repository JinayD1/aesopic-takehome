[project]
name = "aesopic-navigator"
version = "0.1.0"
description = "Vision-model-driven autonomous GitHub navigator that extracts release information without hardcoded selectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.80",
    "playwright>=1.48",
    "pydantic>=2.9",
    "pillow>=10.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
navigate = "navigator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real GitHub site and the Anthropic API (slow, costs money)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
